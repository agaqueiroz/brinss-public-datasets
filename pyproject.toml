[project]
name = "brinss-public-datasets"
version = "0.1.0rc1"
description = "Carregamento e cache de datasets abertos do INSS, no estilo load_iris() do scikit-learn"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "André Galindo Alves de Queiroz" }
]
requires-python = ">=3.12"
keywords = ["inss", "dados-abertos", "open-data", "previdencia-social", "brasil", "pandas"]
# No "License :: OSI Approved :: MIT License" here on purpose: the license is
# already declared above as an SPDX expression, and PyPI rejects a package that
# carries both that and a license classifier.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "openpyxl>=3.1",
    "pandas>=2.2",
    "platformdirs>=4.0",
    "pooch>=1.8",
    # The default source is the Parquet mirror, so reading it is not optional.
    "pyarrow>=17.0",
    "requests>=2.31",
    "xlrd>=2.0.2",
]

[project.urls]
Homepage = "https://github.com/agaqueiroz/brinss-public-datasets"
Repository = "https://github.com/agaqueiroz/brinss-public-datasets"
Issues = "https://github.com/agaqueiroz/brinss-public-datasets/issues"
"Dataset no Hugging Face" = "https://huggingface.co/datasets/agaqueiroz/brinss-public-datasets"

[dependency-groups]
# Only the scripts under scripts/ need these; the library itself does not.
publish = [
    "huggingface-hub>=1.28",
]
dev = [
    # huggingface-hub is needed here too: test_publish_to_hf.py stubs get_token()
    # to exercise the missing-token gate, and monkeypatching it means importing
    # the real module -- the script's lazy import does not spare the tests.
    "huggingface-hub>=1.28",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "ruff>=0.6",
    "xlwt>=1.3.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "brinss"

[tool.pytest.ini_options]
markers = [
    "network: requires internet access (deselected by default)",
]
addopts = "-m 'not network'"
# scripts/ is not part of the distributed package, but its pure helpers are tested.
pythonpath = ["scripts"]
